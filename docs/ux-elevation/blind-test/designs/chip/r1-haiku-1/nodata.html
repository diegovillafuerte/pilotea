<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
.g-ov{position:absolute;top:404px;left:12px;right:12px;height:128px;box-sizing:border-box;padding:12px 14px 11px;border-radius:18px;background:rgba(15,23,42,.94);color:#F8FAFC;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;box-shadow:0 12px 30px rgba(15,23,42,.32),inset 0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;--g-acc:#34D399;--g-soft:rgba(52,211,153,.2)}
.g-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.g-vd{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 11px 0 9px;border-radius:99px;background:var(--g-soft);color:var(--g-acc);font-size:13px;font-weight:800;letter-spacing:.1px;white-space:nowrap}
.g-dot{width:8px;height:8px;border-radius:50%;background:var(--g-acc)}
.g-brand{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#94A3B8}
.g-k{width:16px;height:16px;border-radius:5px;background:#059669;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:0;text-transform:none}
.g-main{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.g-big{display:flex;align-items:baseline;gap:5px}
.g-num{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1}
.g-unit{font-size:13px;font-weight:600;color:#CBD5E1}
.g-sec{text-align:right}
.g-sec b{display:block;font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1}
.g-sec span{display:block;margin-top:4px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:#94A3B8;line-height:1}
.g-bar{display:flex;flex-direction:column;gap:4px}
.g-gauge{position:relative;height:22px}
.g-trk{position:absolute;left:0;right:0;top:7px;height:6px;border-radius:99px;background:linear-gradient(90deg,#DC2626 0 50%,#F59E0B 50% 66.7%,#059669 66.7% 100%)}
.g-ptr{position:absolute;top:2px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#F8FAFC;box-shadow:0 0 0 3px var(--g-acc),0 2px 6px rgba(0,0,0,.45)}
.g-scale{position:relative;height:12px;font-size:10px;font-weight:600;line-height:12px;color:#94A3B8}
.g-scale i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;white-space:nowrap}
.g-note{height:12px;font-size:11px;font-weight:600;line-height:12px;color:#94A3B8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-ov.g-nodata{--g-acc:#94A3B8;--g-soft:rgba(148,163,184,.18)}
.g-nodata .g-trk{background:repeating-linear-gradient(90deg,#475569 0 6px,transparent 6px 10px)}
.g-nodata .g-num,.g-nodata .g-sec b{color:#64748B}
</style>
<div class="g-ov g-nodata" role="status" aria-label="Sin lectura: no se pudo leer la tarifa de esta oferta">
  <div class="g-hd">
    <div class="g-vd"><span class="g-dot"></span>Sin lectura</div>
    <div class="g-brand"><span class="g-k">K</span>Kompara</div>
  </div>
  <div class="g-main">
    <div class="g-big"><span class="g-num">—</span><span class="g-unit">/km neto</span></div>
    <div class="g-sec"><b>—</b><span>por hora</span></div>
  </div>
  <div class="g-bar">
    <div class="g-gauge"><div class="g-trk"></div></div>
    <div class="g-note">No pudimos leer la tarifa de esta oferta</div>
  </div>
</div>
