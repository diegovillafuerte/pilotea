<style>

.g-ico{position:relative;display:block;width:30px;height:30px}

.g-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:9px 16px 8px 14px}
.g-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.g-main{display:flex;align-items:flex-end;gap:6px}
.g-num{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.035em;white-space:nowrap}
.g-cur{position:relative;top:-11px;font-size:22px;font-weight:700;letter-spacing:0;margin-right:1px}

.g-scale{position:relative;height:24px;margin-top:10px}
.g-track{position:absolute;left:0;right:0;top:0;height:6px}
.g-z{position:absolute;top:0;height:6px;opacity:.28}
.g-zr{left:0;width:calc(50% - 1px);background:#F05252;border-radius:3px 0 0 3px}
.g-zy{left:calc(50% + 1px);width:calc(16.667% - 2px);background:#FACC15}
.g-zg{left:calc(66.667% + 1px);right:0;background:#22C55E;border-radius:0 3px 3px 0}
.g-on{opacity:1}
.g-dot{position:absolute;top:-4px;left:59.667%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #FACC15,0 2px 6px rgba(0,0,0,.55)}
.g-tl{position:absolute;top:14px;left:0;font-size:10px;font-weight:500;line-height:1;color:rgba(255,255,255,.42)}
.g-tk{position:absolute;top:14px;font-size:10px;font-weight:600;line-height:1;color:rgba(255,255,255,.58);transform:translateX(-50%)}
.g-t6{left:50%}
.g-t8{left:66.667%}

        <div class="g-hl">por hora</div>
      </div>
    </div>
    <div class="g-scale">
      <div class="g-track">
        <span class="g-z g-zr"></span><span class="g-z g-zy g-on"></span><span class="g-z g-zg"></span>
      </div>
      <span class="g-dot"></span>
      <span class="g-tl">tus límites</span>
      <span class="g-tk g-t6">$6</span>

    </div>
  </div>
