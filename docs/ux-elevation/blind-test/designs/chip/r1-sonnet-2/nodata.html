<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
.g-root{position:absolute;top:402px;left:12px;right:12px;z-index:50;pointer-events:none;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;--g-bg:#0A8043;--g-fg:#fff;--g-fg2:rgba(255,255,255,.92);--g-panel:rgba(0,0,0,.18);--g-seg:rgba(255,255,255,.3)}
.g-root *{box-sizing:border-box;margin:0;padding:0}
.g-s-green{--g-bg:#0A8043}
.g-s-yellow{--g-bg:#FFC21A;--g-fg:#1A1300;--g-fg2:rgba(26,19,0,.78);--g-panel:rgba(26,19,0,.1);--g-seg:rgba(26,19,0,.22)}
.g-s-red{--g-bg:#C5281E}
.g-s-nodata{--g-bg:#36404C;--g-panel:transparent;--g-seg:rgba(255,255,255,.34)}
.g-card{position:relative;height:132px;padding:11px 16px 9px;border-radius:24px;color:var(--g-fg);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(0,0,0,.07)),var(--g-bg);box-shadow:0 0 0 1px rgba(255,255,255,.4),0 10px 28px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.28)}
.g-main{display:flex;gap:12px;height:76px}
.g-left{flex:1;min-width:0;display:flex;flex-direction:column}
.g-verdict{display:flex;align-items:center;gap:8px;height:22px;margin-bottom:4px}
.g-ico{flex:none;width:22px;height:22px;border-radius:50%;background:var(--g-fg);color:var(--g-bg);display:flex;align-items:center;justify-content:center}
.g-ico svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.g-word{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.g-hero{display:flex;align-items:baseline;height:50px;line-height:1;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.g-cur{align-self:flex-start;margin:5px 2px 0 0;font-size:26px;font-weight:700}
.g-num{font-size:50px;font-weight:800;letter-spacing:-.04em}
.g-unit{align-self:center;margin-left:8px;display:flex;flex-direction:column;gap:2px}
.g-unit b{font-size:17px;font-weight:800;line-height:1}
.g-unit small{font-size:11px;font-weight:600;line-height:1;letter-spacing:.06em;text-transform:uppercase;color:var(--g-fg2)}
.g-msg{display:flex;align-items:center;height:50px;font-size:20px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.g-tile{flex:none;width:96px;border-radius:16px;background:var(--g-panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.g-tile-n{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.g-tile-n i{position:relative;top:2px;margin-right:1px;font-style:normal;font-size:17px;font-weight:700;vertical-align:top}
.g-tile-n-s{font-size:17px;line-height:1.1;letter-spacing:0;text-align:center}
.g-tile-l{font-size:12px;font-weight:600;line-height:1;color:var(--g-fg2)}
.g-scale{margin-top:9px}
.g-track{position:relative;display:flex;gap:3px;height:8px}
.g-seg{flex:1;background:var(--g-seg)}
.g-seg:first-child{border-radius:4px 1px 1px 4px}
.g-seg:nth-child(3){border-radius:1px 4px 4px 1px}
.g-on{background:var(--g-fg)}
.g-pin{position:absolute;top:-5px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--g-fg);border:3.5px solid var(--g-bg);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.g-ticks{position:relative;height:14px;margin-top:4px;font-size:11px;font-weight:700;line-height:14px;color:var(--g-fg2);font-variant-numeric:tabular-nums}
.g-ticks span{position:absolute;top:0;transform:translateX(-50%)}
.g-ticks .g-cap{left:0;transform:none;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.g-s-nodata .g-ico{background:rgba(255,255,255,.2);color:#fff}
.g-s-nodata .g-tile{border:1.5px dashed rgba(255,255,255,.4)}
.g-s-nodata .g-seg{background:repeating-linear-gradient(90deg,var(--g-seg) 0 7px,transparent 7px 11px)}
</style>
<div class="g-root g-s-nodata" role="status" aria-label="Sin lectura. No se pudo leer la tarifa de esta oferta. Tú decides.">
  <div class="g-card">
    <div class="g-main">
      <div class="g-left">
        <div class="g-verdict"><span class="g-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 9.2a3 3 0 1 1 4.6 2.5c-1 .65-1.6 1.2-1.6 2.5"/><circle cx="12" cy="18.2" r="1.3" fill="currentColor" stroke="none"/></svg></span><span class="g-word">Sin lectura</span></div>
        <div class="g-msg">No se pudo leer<br>la tarifa</div>
      </div>
      <div class="g-tile"><span class="g-tile-n g-tile-n-s">Tú<br>decides</span></div>
    </div>
    <div class="g-scale" aria-hidden="true">
      <div class="g-track"><i class="g-seg"></i><i class="g-seg"></i><i class="g-seg"></i></div>
      <div class="g-ticks"><span class="g-cap">Tus límites</span><span style="left:calc(33.33% - .5px)">$6</span><span style="left:calc(66.67% + .5px)">$8</span></div>
    </div>
  </div>
</div>
