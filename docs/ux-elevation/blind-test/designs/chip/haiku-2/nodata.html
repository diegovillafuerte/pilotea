<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
.g-root{position:absolute;top:350px;left:16px;right:16px;z-index:50;pointer-events:none;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased;}
.g-card{background:#FFFFFF;border-radius:20px;overflow:hidden;box-shadow:0 12px 28px rgba(15,23,42,.24),0 1px 3px rgba(15,23,42,.14);}
.g-band{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 16px;background:#475569;color:#FFFFFF;}
.g-verdict{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
.g-dot{width:9px;height:9px;box-sizing:border-box;border-radius:50%;border:2px solid #FFFFFF;background:transparent;}
.g-brand{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.92;}
.g-brand-k{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;}
.g-body{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 16px 0;}
.g-num{font-size:44px;line-height:1;font-weight:800;letter-spacing:-.02em;color:#94A3B8;font-variant-numeric:tabular-nums;white-space:nowrap;}
.g-unit{font-size:16px;font-weight:700;letter-spacing:0;color:#94A3B8;margin-left:3px;}
.g-sub{margin-top:6px;font-size:12px;font-weight:500;color:#475569;}
.g-hour{text-align:right;padding-bottom:2px;}
.g-hour-v{font-size:24px;line-height:1;font-weight:800;color:#94A3B8;font-variant-numeric:tabular-nums;white-space:nowrap;}
.g-hour-l{margin-top:4px;font-size:11px;font-weight:600;color:#64748B;}
.g-track{position:relative;height:8px;margin:14px 16px 0;}
.g-segs{height:100%;border-radius:999px;overflow:hidden;background:#E2E8F0;}
.g-foot{display:flex;justify-content:space-between;padding:10px 16px 10px;font-size:11px;font-weight:600;color:#64748B;}
.g-foot b{color:#334155;font-weight:700;}
</style>
<div class="g-root" role="status" aria-label="Sin datos: no pudimos leer el pago de esta oferta">
  <div class="g-card">
    <div class="g-band">
      <div class="g-verdict"><span class="g-dot"></span>Sin datos</div>
      <div class="g-brand"><span class="g-brand-k">K</span>KOMPARA</div>
    </div>
    <div class="g-body">
      <div>
        <div class="g-num">—<span class="g-unit">/km</span></div>
        <div class="g-sub">No leímos el pago. Decide tú.</div>
      </div>
      <div class="g-hour">
        <div class="g-hour-v">—<span class="g-unit">/h</span></div>
        <div class="g-hour-l">por hora</div>
      </div>
    </div>
    <div class="g-track"><div class="g-segs"></div></div>
    <div class="g-foot"><span>Tu mínimo <b>$6.00/km</b></span><span>Tu meta <b>$8.00/km</b></span></div>
  </div>
</div>
