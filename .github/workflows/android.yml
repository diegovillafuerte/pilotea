name: Android CI

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify read-only capture (Play policy, B-091)
        run: ./gradlew verifyReadOnlyCapture

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # A red run keeps what is needed to see why: each failed assertion's message, the lint
      # report, and the screenshots the tests rendered on this runner.
      - name: Upload reports and rendered screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            android/*/build/reports/tests/testDebugUnitTest
            android/*/build/test-results/testDebugUnitTest
            android/*/build/reports/lint-results-debug.*
            android/*/build/outputs/v3-screenshots
            android/*/build/outputs/v4-screenshots
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
